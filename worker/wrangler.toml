name = "birthday-email"
main = "src/index.js"
compatibility_date = "2025-01-01"

[vars]
ALLOWED_ORIGINS = "https://reyaadivakar.com,https://www.reyaadivakar.com"
BIRTHDAY_FROM_EMAIL = "birthday@reyaadivakar.com"

# Create with: npx wrangler kv namespace create BIRTHDAY_EMAIL_LIMIT
# then paste the returned id below.
[[kv_namespaces]]
binding = "BIRTHDAY_EMAIL_LIMIT"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
