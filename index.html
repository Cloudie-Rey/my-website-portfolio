<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Reyaa Divakar</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  
  <!-- Stylesheet -->
  <link rel="stylesheet" href="style.css?v=20261113-phone-controls-14">
</head>
<body>

  <!-- Top Navigation Bar -->
  <header>
    <div class="brand"><b>🌩️</b> Reyaa<span>Divakar</span></div>
    <nav class="sw" id="view-switch">
      <button id="b3" class="on">Interactive View</button>
      <button id="bg">Classic View</button>
    </nav>
    <div class="st">● SYSTEMS ONLINE</div>
    <button id="menu-toggle" type="button" aria-label="Switch view" aria-expanded="false" aria-controls="view-switch">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
  </header>

  <!-- Main Display View Canvas -->
  <main>
    <!-- 3D Interactive Canvas Scene -->
    <section id="v3d" class="view on">
      <div id="stage"></div>
      <div id="labels"></div>
      <div class="hint">Drag to orbit · scroll to zoom · click on a number and explore!</div>
      <div id="holiday-message" class="holiday-message" role="status" aria-live="polite" hidden>
        <span>Happy birthday to the dev! 🎂</span>
        <button id="holiday-message-close" type="button" aria-label="Dismiss message">×</button>
      </div>
      <div id="object-controls" hidden>
       <button id="back" type="button" aria-label="Back to workshop">
  <span class="back-arrow" aria-hidden="true">←</span>
  <span class="back-label">Back</span>
</button>
        <nav id="object-nav" aria-label="Navigate between workshop items">
          <button id="object-prev" type="button" aria-label="Previous item" title="Previous item">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg>
          </button>
          <span id="object-position" aria-live="polite"></span>
          <button id="object-next" type="button" aria-label="Next item" title="Next item">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg>
          </button>
        </nav>
      </div>
      <button id="spotify-toggle" aria-pressed="false" disabled>Loading music...</button>
      
      <!-- Interactive Slide-out Modal -->
      <aside id="modal">
        <button class="x" id="mx" aria-label="Close">×</button>
        <div id="mb"></div>
        <div id="spotify-player" class="spotify-embed spotify-player-offscreen" aria-hidden="true">
          <div id="spotify-iframe"></div>
        </div>
      </aside>
    </section>

    <!-- Professional Modular Grid View -->
    <section id="vgrid" class="view">
      <div class="gw">
        <nav id="side"></nav>
        <div id="panel"></div>
      </div>
    </section>
  </main>

  <!-- External Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <!-- Application Logic -->
  <script type="module" src="script.js?v=20261113-phone-controls-14"></script>
</body>
</html>
